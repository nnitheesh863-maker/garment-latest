# Docker Compose Configuration for Garment ERP Platform
# Includes multi-service healthchecks, network isolation, and volume persistence

version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: garment-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    environment:
      MONGO_INITDB_DATABASE: garment_production

  redis:
    image: redis:7-alpine
    container_name: garment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garment-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/garment_production
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:5001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garment-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: garment-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ai-models:/app/models/saved

  nginx:
    image: nginx:alpine
    container_name: garment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
      - ai-service

volumes:
  mongo-data:
  redis-data:
  uploads:
  ai-models:
